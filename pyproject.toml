[build-system]
requires = ['uv_build>=0.9,<0.14']
build-backend = 'uv_build'

[project]
name = 'virtualenv-asdf'
version = '0.2.0'
description = 'A virtualenv Python discovery plugin using asdf'
license = 'MIT'
license-files = ['LICENSE']
authors = [{name = 'Scott Sharkey', email = 'ssharkey@lanshark.com'}]
readme = 'README.md'
requires-python = '>=3.11'
keywords = ['virtualenv', 'asdf']
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Topic :: Software Development :: Libraries',
    'Topic :: Software Development :: Testing',
    'Topic :: Utilities',
]
dependencies = [
    'virtualenv',
    'asdf-inspect~=0.1',
]

[project.urls]
Homepage = 'https://github.com/lanshark/virtualenv-asdf'
Repository = 'https://github.com/lanshark/virtualenv-asdf'

[project.entry-points.'virtualenv.discovery']
asdf = '_virtualenv_asdf.discovery:ASDF'

[dependency-groups]
dev = [
    'pytest',
    'pytest-mock',
    'flake8',
    'isort',
]

[tool.uv.build-backend]
module-name = '_virtualenv_asdf'

[tool.isort]
lines_after_imports = 2
multi_line_output = 5
include_trailing_comma = true
use_parentheses = true
known_first_party = ['_virtualenv_asdf']
known_third_party = ['virtualenv', 'asdf_inspect']

[tool.pytest.ini_options]
minversion = '7.0'
testpaths = ['tests']

[tool.tox]
legacy_tox_ini = '''
[tox]
envlist =
    py311
    py312
    py313
    py314
    py315
    flake8
    isort
isolated_build = true

[testenv]
deps =
    pytest
    pytest-mock
commands = pytest {posargs}

[testenv:flake8]
skip_install = true
deps = flake8
commands = flake8 {posargs}

[testenv:isort]
skip_install = true
deps = isort
commands = isort {posargs:. -c}
'''
